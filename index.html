<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Software</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#e8e8e8;
    padding:20px;
}

.box{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1,h2{
    text-align:center;
    color:#333;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.header h1{
    color:#007bff;
}

.btn-clear{
    background:#dc3545 !important;
}

.btn-clear:hover{
    background:#c82333 !important;
}

.status-bar{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#f8f9fa;
    border-radius:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
}

.status-item{
    text-align:center;
    flex:1;
    min-width:100px;
}

.status-item span{
    display:block;
    font-size:24px;
    font-weight:bold;
    color:#007bff;
}

.status-item label{
    font-size:12px;
    color:#666;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

#search, #searchOption, #reportMonth{
    padding:12px 15px;
    border:2px solid #ddd;
    border-radius:25px;
    font-size:14px;
}

#search{
    width:300px;
}

#search:focus, #reportMonth:focus{
    outline:none;
    border-color:#007bff;
}

.file-upload{
    display:flex;
    align-items:center;
}

.file-upload label{
    background:#007bff;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    transition:background 0.3s;
}

.file-upload label:hover{
    background:#0056b3;
}

.file-upload input{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
    font-weight:600;
}

tr:nth-child(even){
    background:#f9f9f9;
}

tr:hover{
    background:#f0f0f0;
}

.stock-zero{
    background:#ffcccc !important;
}

.stock-low{
    background:#ffffcc !important;
}

.total-row{
    font-weight:bold;
    background:#e8e8e8 !important;
}

input[type="number"]{
    width:70px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:5px;
    text-align:center;
}

button{
    padding:8px 15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.3s;
}

button:hover{
    background:#0056b3;
}

.btn-issue{
    background:#dc3545;
}

.btn-issue:hover{
    background:#c82333;
}

.btn-receive{
    background:#28a745;
}

.btn-receive:hover{
    background:#218838;
}

.btn-ledger{
    background:#17a2b8;
}

.btn-ledger:hover{
    background:#138496;
}

.btn-download{
    background:#6f42c1;
}

.btn-download:hover{
    background:#5a32a3;
}

.btn-delete{
    background:#dc3545;
    padding:5px 10px;
    font-size:16px;
}

.report-section{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
    flex-wrap:wrap;
}

.report-section button{
    padding:12px 25px;
    font-size:14px;
}

textarea{
    width:100%;
    height:80px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:5px;
    font-family:inherit;
    resize:vertical;
    margin-top:15px;
}

.narration-section{
    margin-top:25px;
    padding:20px;
    background:#f8f9fa;
    border-radius:10px;
}

.narration-section h2{
    margin-bottom:15px;
}

.empty-row td{
    padding:30px !important;
}

</style>

</head>

<body>

<div class="box">

<div class="header">

<h1>📦 Inventory Software</h1>

<button class="btn-clear" onclick="clearAllData()">🗑️ Clear All Data</button>

</div>

<!-- STATUS BAR -->

<div class="status-bar">

<div class="status-item">

<span id="totalProducts">0</span>

<label>Total Products</label>

</div>

<div class="status-item">

<span id="totalStock">0</span>

<label>Total Stock</label>

</div>

<div class="status-item">

<span id="totalValue">₹0</span>

<label>Total Value</label>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<input
type="text"
id="search"
placeholder="Search product, narration, date..."
onkeyup="searchProduct()">

<select id="searchOption">

<option value="all">Search All</option>

<option value="product">By Product</option>

<option value="narration">By Narration</option>

</select>

<div class="file-upload">

<label for="excelFile">📤 Upload Excel</label>

<input type="file" id="excelFile" accept=".xlsx,.xls">

</div>

<button class="btn-download" onclick="downloadExcel()">📥 Download Excel</button>

</div>

<!-- TABLE -->

<table>

<thead>

<tr>

<th>S.No</th>

<th>Product</th>

<th>Price (₹)</th>

<th>Stock</th>

<th>Value (₹)</th>

<th>Issue Qty</th>

<th>Issue</th>

<th>Receive Qty</th>

<th>Receive</th>

<th>Ledger</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<!-- REPORT SECTION -->

<div class="report-section">

<select id="reportMonth">

<option value="">Select Month (All)</option>

</select>

<button onclick="monthlyReport()">📊 Monthly Report</button>

<button onclick="stockSummary()">📈 Stock Summary</button>

<button class="btn-download" onclick="exportAllLedger()">📋 Export Full Ledger</button>

</div>

<!-- NARRATION -->

<div class="narration-section">

<h2>📝 Issue / Receive Narration</h2>

<textarea
id="narration"
placeholder="Enter narration for transactions (e.g., 'Sold to ABC company' or 'Received from XYZ supplier')"></textarea>

</div>

</div>

<script>

// ==================== INITIALIZATION ====================

let products = [];

let filteredProducts = [];

// Initialize
function init() {
    
    let storedData = localStorage.getItem('inventoryProducts');
    
    if (storedData) {
        
        products = JSON.parse(storedData);
        
    }
    
    filteredProducts = [...products];
    
    populateMonthOptions();
    
    displayProducts();
    
    updateStatus();
    
}

init();

// ==================== SAVE DATA ====================

function saveData() {
    
    localStorage.setItem('inventoryProducts', JSON.stringify(products));
    
    filteredProducts = [...products];
    
    updateStatus();
    
}

// ==================== UPDATE STATUS ====================

function updateStatus() {
    
    let totalProducts = products.length;
    
    let totalStock = 0;
    
    let totalValue = 0;
    
    products.forEach(p => {
        
        totalStock += p.Quantity;
        
        totalValue += p.Quantity * p.Price;
        
    });
    
    document.getElementById('totalProducts').textContent = totalProducts;
    
    document.getElementById('totalStock').textContent = totalStock;
    
    document.getElementById('totalValue').textContent = '₹' + totalValue.toLocaleString();
    
}

// ==================== DISPLAY PRODUCTS ====================

function displayProducts() {
    
    let tbody = document.getElementById('tbody');
    
    let html = '';
    
    filteredProducts.forEach((item, index) => {
        
        let stockClass = '';
        
        if (item.Quantity === 0) {
            
            stockClass = 'stock-zero';
            
        } else if (item.Quantity < 10) {
            
            stockClass = 'stock-low';
            
        }
        
        let value = item.Quantity * item.Price;
        
        // Find original index
        let originalIndex = products.findIndex(p => p.Product === item.Product);
        
        html += `
        
        <tr>
        
            <td>${index + 1}</td>
            
            <td><strong>${item.Product}</strong></td>
            
            <td>₹${item.Price}</td>
            
            <td class="${stockClass}">${item.Quantity}</td>
            
            <td>₹${value.toLocaleString()}</td>
            
            <td>
            
                <input type="number" id="issue${originalIndex}" min="0" max="${item.Quantity}" placeholder="Qty" value="">
            
            </td>
            
            <td>
            
                <button class="btn-issue" onclick="issueStock(${originalIndex})">Issue</button>
            
            </td>
            
            <td>
            
                <input type="number" id="receive${originalIndex}" min="0" placeholder="Qty" value="">
            
            </td>
            
            <td>
            
                <button class="btn-receive" onclick="receiveStock(${originalIndex})">Receive</button>
            
            </td>
            
            <td>
            
                <button class="btn-ledger" onclick="showHistory(${originalIndex})">Ledger</button>
            
            </td>
            
            <td>
            
                <button class="btn-delete" onclick="deleteProduct(${originalIndex})">🗑️</button>
            
            </td>
        
        </tr>
        
        `;
        
    });
    
    if (filteredProducts.length === 0) {
        
        html = `
        
        <tr class="empty-row">
        
            <td colspan="11">
            
                <p style="padding:30px; text-align:center; color:#666;">
                
                📦 No products found.<br>
                Upload an Excel file or add products manually.<br><br>
                Excel Format: Product | Price | Stock
                
                </p>
            
            </td>
        
        </tr>
        
        `;
        
    }
    
    tbody.innerHTML = html;
    
    addTotalRow();
    
}

function addTotalRow() {
    
    let totalStock = 0;
    
    let totalValue = 0;
    
    filteredProducts.forEach(p => {
        
        totalStock += p.Quantity;
        
        totalValue += p.Quantity * p.Price;
        
    });
    
    let tbody = document.getElementById('tbody');
    
    let totalHtml = `
    
    <tr class="total-row">
    
        <td colspan="3"><strong>TOTAL</strong></td>
        
        <td><strong>${totalStock}</strong></td>
        
        <td><strong>₹${totalValue.toLocaleString()}</strong></td>
        
        <td colspan="6"></td>
    
    </tr>
    
    `;
    
    tbody.innerHTML += totalHtml;
    
}

// ==================== EXCEL UPLOAD ====================

document.getElementById('excelFile').addEventListener('change', function(e) {
    
    let file = e.target.files[0];
    
    if (!file) return;
    
    let reader = new FileReader();
    
    reader.onload = function(event) {
        
        try {
            
            let data = new Uint8Array(event.target.result);
            
            let workbook = XLSX.read(data, {type: 'array'});
            
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            let excelData = XLSX.utils.sheet_to_json(sheet);
            
            if (excelData.length === 0) {
                
                alert('Excel file is empty!');
                
                return;
                
            }
            
            let importCount = 0;
            
            let updateCount = 0;
            
            excelData.forEach(row => {
                
                let productName = row.Product || row.product || row.Particulars || row.Name || '';
                
                let price = Number(row.Price || row.price || row.Rate || 0);
                
                let quantity = Number(row.Stock || row.stock || row.Quantity || row.quantity || 0);
                
                if (!productName) return;
                
                // Check duplicate
                let existingIndex = products.findIndex(p => 
                    p.Product.toLowerCase() === productName.toLowerCase()
                );
                
                if (existingIndex >= 0) {
                    
                    // Update existing
                    let oldQty = products[existingIndex].Quantity;
                    
                    products[existingIndex].Price = price;
                    
                    products[existingIndex].Quantity += quantity;
                    
                    products[existingIndex].History.push({
                        
                        type: 'Stock Adjustment',
                        
                        qty: quantity,
                        
                        narration: `Added ${quantity} from Excel`,
                        
                        date: new Date().toLocaleString()
                        
                    });
                    
                    updateCount++;
                    
                } else {
                    
                    // Add new
                    products.push({
                        
                        Product: productName,
                        
                        Price: price,
                        
                        Quantity: quantity,
                        
                        History: [{
                            
                            type: 'Received',
                            
                            qty: quantity,
                            
                            narration: 'Opening Stock from Excel',
                            
                            date: new Date().toLocaleString()
                            
                        }]
                        
                    });
                    
                    importCount++;
                    
                }
                
            });
            
            saveData();
            
            displayProducts();
            
            document.getElementById('excelFile').value = '';
            
            alert(`✅ Import Complete!\n\nNew Products: ${importCount}\nUpdated: ${updateCount}`);
            
        } catch (error) {
            
            alert('Error: ' + error.message);
            
            console.error(error);
            
        }
        
    };
    
    reader.readAsArrayBuffer(file);
    
});

// ==================== DOWNLOAD EXCEL ====================

function downloadExcel() {
    
    if (products.length === 0) {
        
        alert('No products to download!');
        
        return;
        
    }
    
    let exportData = products.map(p => ({
        
        'Product': p.Product,
        
        'Price': p.Price,
        
        'Stock': p.Quantity,
        
        'Value': p.Quantity * p.Price
        
    }));
    
    let ws = XLSX.utils.json_to_sheet(exportData);
    
    let wb = XLSX.utils.book_new();
    
    XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
    
    XLSX.writeFile(wb, 'Inventory_' + new Date().toISOString().slice(0, 10) + '.xlsx');
    
    alert('✅ Excel downloaded!');
    
}

// ==================== ISSUE STOCK ====================

function issueStock(index) {
    
    let issueQty = Number(document.getElementById('issue' + index).value);
    
    let narration = document.getElementById('narration').value.trim();
    
    if (!issueQty || issueQty <= 0) {
        
        alert('Please enter valid quantity!');
        
        return;
        
    }
    
    if (issueQty > products[index].Quantity) {
        
        alert('Not enough stock available!');
        
        return;
        
    }
    
    // Update stock
    products[index].Quantity -= issueQty;
    
    // Add history
    products[index].History.push({
        
        type: 'Issue',
        
        qty: issueQty,
        
        narration: narration || 'Stock Issued',
        
        date: new Date().toLocaleString()
        
    });
    
    saveData();
    
    displayProducts();
    
    // Clear inputs
    document.getElementById('issue' + index).value = '';
    
    document.getElementById('narration').value = '';
    
    alert('✅ Stock Issued Successfully!');
    
}

// ==================== RECEIVE STOCK ====================

function receiveStock(index) {
    
    let receiveQty = Number(document.getElementById('receive' + index).value);
    
    let narration = document.getElementById('narration').value.trim();
    
    if (!receiveQty || receiveQty <= 0) {
        
        alert('Please enter valid quantity!');
        
        return;
        
    }
    
    // Update stock
    products[index].Quantity += receiveQty;
    
    // Add history
    products[index].History.push({
        
        type: 'Received',
        
        qty: receiveQty,
        
        narration: narration || 'Stock Received',
        
        date: new Date().toLocaleString()
        
    });
    
    saveData();
    
    displayProducts();
    
    // Clear inputs
    document.getElementById('receive' + index).value = '';
    
    document.getElementById('narration').value = '';
    
    alert('✅ Stock Received Successfully!');
    
}

// ==================== SHOW HISTORY ====================

function showHistory(index) {
    
    let product = products[index];
    
    let history = product
