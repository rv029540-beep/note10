<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Software</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#e8e8e8;
    padding:20px;
}

.box{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1,h2{
    text-align:center;
    color:#333;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.header h1{
    color:#007bff;
}

.header button{
    background:#28a745;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search-box{
    position:relative;
}

#search{
    padding:12px 40px 12px 15px;
    width:350px;
    border:2px solid #ddd;
    border-radius:25px;
    font-size:14px;
    transition:border-color 0.3s;
}

#search:focus{
    outline:none;
    border-color:#007bff;
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#aaa;
}

#searchOption{
    padding:12px;
    border:2px solid #ddd;
    border-radius:25px;
    background:white;
}

.file-upload{
    display:flex;
    align-items:center;
    gap:10px;
}

.file-upload label{
    background:#007bff;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    transition:background 0.3s;
}

.file-upload label:hover{
    background:#0056b3;
}

.file-upload input{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
    font-weight:600;
}

tr:nth-child(even){
    background:#f9f9f9;
}

tr:hover{
    background:#f0f0f0;
}

.stock-low{
    background:#ffcccc !important;
    color:red;
}

.stock-ok{
    background:#ccffcc !important;
    color:green;
}

input[type="number"]{
    width:70px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:5px;
    text-align:center;
}

button{
    padding:8px 15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.3s;
}

button:hover{
    background:#0056b3;
}

.btn-issue{
    background:#dc3545;
}

.btn-issue:hover{
    background:#c82333;
}

.btn-receive{
    background:#28a745;
}

.btn-receive:hover{
    background:#218838;
}

.btn-ledger{
    background:#17a2b8;
}

.btn-ledger:hover{
    background:#138496;
}

.btn-delete{
    background:#dc3545;
    padding:5px 10px;
}

.report-section{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
    flex-wrap:wrap;
}

.report-section button{
    padding:12px 25px;
    font-size:14px;
}

.report-select{
    padding:12px;
    border:2px solid #ddd;
    border-radius:25px;
    background:white;
}

textarea{
    width:100%;
    height:80px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:5px;
    font-family:inherit;
    resize:vertical;
}

.total-row{
    font-weight:bold;
    background:#e8e8e8 !important;
}

.modal-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    justify-content:center;
    align-items:center;
}

.modal-overlay.active{
    display:flex;
}

.modal-content{
    background:white;
    padding:30px;
    border-radius:15px;
    width:90%;
    max-width:800px;
    max-height:80vh;
    overflow-y:auto;
}

.modal-content h2{
    margin-bottom:20px;
}

.close-modal{
    position:absolute;
    top:20px;
    right:20px;
    font-size:30px;
    cursor:pointer;
    color:#666;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.pagination button{
    padding:8px 12px;
}

.status-bar{
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#f8f9fa;
    border-radius:10px;
    margin-bottom:20px;
}

.status-item{
    text-align:center;
}

.status-item span{
    display:block;
    font-size:24px;
    font-weight:bold;
    color:#007bff;
}

.status-item label{
    font-size:12px;
    color:#666;
}

</style>

</head>

<body>

<div class="box">

<div class="header">

<h1>📦 Inventory Software</h1>

<button onclick="clearAllData()">🗑️ Clear All Data</button>

</div>

<!-- STATUS BAR -->

<div class="status-bar">

<div class="status-item">

<span id="totalProducts">0</span>

<label>Total Products</label>

</div>

<div class="status-item">

<span id="totalStock">0</span>

<label>Total Stock</label>

</div>

<div class="status-item">

<span id="totalValue">₹0</span>

<label>Total Value</label>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search products, narration, dates..."
onkeyup="searchProduct()">

<span class="search-icon">🔍</span>

</div>

<select id="searchOption" onchange="searchProduct()">

<option value="all">Search All</option>

<option value="product">Product Name</option>

<option value="narration">Narration</option>

<option value="date">Date</option>

</select>

<div class="file-upload">

<label for="excelFile">

📤 Upload Excel

</label>

<input type="file" id="excelFile" accept=".xlsx,.xls">

</div>

<button onclick="downloadExcel()">📥 Download Excel</button>

</div>

<!-- TABLE -->

<table>

<thead>

<tr>

<th>S.No</th>

<th>Product</th>

<th>Price (₹)</th>

<th>Stock</th>

<th>Value (₹)</th>

<th>Issue Qty</th>

<th>Issue</th>

<th>Receive Qty</th>

<th>Receive</th>

<th>Ledger</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<!-- REPORT SECTION -->

<div class="report-section">

<select id="reportMonth" class="report-select">

<option value="">Select Month</option>

</select>

<button onclick="monthlyReport()">📊 Monthly Report</button>

<button onclick="stockSummary()">📈 Stock Summary</button>

<button onclick="exportLedger()">📋 Export All LEDGER</button>

</div>

<!-- NARRATION -->

<h2 style="margin-top:25px;">📝 Issue / Receive Narration</h2>

<textarea
id="narration"
placeholder="Enter narration for transactions e.g., 'Sold to customer ABC' or 'Received from supplier XYZ'"></textarea>

</div>

<!-- MODAL FOR LEDGER -->

<div class="modal-overlay" id="ledgerModal">

<div class="modal-content">

<span class="close-modal" onclick="closeModal()">&times;</span>

<h2 id="ledgerTitle">Stock Ledger</h2>

<table id="ledgerTable">

<thead>

<tr>

<th>Type</th>

<th>Quantity</th>

<th>Narration</th>

<th>Date & Time</th>

<th>Action</th>

</tr>

</thead>

<tbody id="ledgerBody"></tbody>

</table>

</div>

</div>

<script>

// ==================== INITIALIZATION ====================

let products = [];

let currentProductIndex = null;

let itemsPerPage = 50;

let currentPage = 1;

// Initialize data
function init() {
    
    // Load from localStorage
    let storedData = localStorage.getItem('inventoryProducts');
    
    if (storedData) {
        
        products = JSON.parse(storedData);
        
    }
    
    // Populate month options
    populateMonthOptions();
    
    // Display products
    displayProducts();
    
    // Update status
    updateStatus();
    
}

init();

// ==================== SAVE DATA ====================

function saveData() {
    
    localStorage.setItem('inventoryProducts', JSON.stringify(products));
    
    updateStatus();
    
}

// ==================== UPDATE STATUS ====================

function updateStatus() {
    
    let totalProducts = products.length;
    
    let totalStock = 0;
    
    let totalValue = 0;
    
    products.forEach(p => {
        
        totalStock += p.Quantity;
        
        totalValue += p.Quantity * p.Price;
        
    });
    
    document.getElementById('totalProducts').textContent = totalProducts;
    
    document.getElementById('totalStock').textContent = totalStock;
    
    document.getElementById('totalValue').textContent = '₹' + totalValue.toLocaleString();
    
}

// ==================== DISPLAY PRODUCTS ====================

function displayProducts() {
    
    let tbody = document.getElementById('tbody');
    
    let html = '';
    
    products.forEach((item, index) => {
        
        let stockClass = '';
        
        if (item.Quantity === 0) {
            
            stockClass = 'stock-low';
            
        } else if (item.Quantity > 10) {
            
            stockClass = 'stock-ok';
            
        }
        
        let value = item.Quantity * item.Price;
        
        html += `
        
        <tr>
        
            <td>${index + 1}</td>
            
            <td><strong>${item.Product}</strong></td>
            
            <td>₹${item.Price}</td>
            
            <td class="${stockClass}">${item.Quantity}</td>
            
            <td>₹${value.toLocaleString()}</td>
            
            <td>
            
                <input
                type="number"
                id="issue${index}"
                min="0"
                max="${item.Quantity}"
                placeholder="Qty"
                value="">
            
            </td>
            
            <td>
            
                <button class="btn-issue" onclick="issueStock(${index})">
                
                Issue
                
                </button>
            
            </td>
            
            <td>
            
                <input
                type="number"
                id="receive${index}"
                min="0"
                placeholder="Qty"
                value="">
            
            </td>
            
            <td>
            
                <button class="btn-receive" onclick="receiveStock(${index})">
                
                Receive
                
                </button>
            
            </td>
            
            <td>
            
                <button class="btn-ledger" onclick="showHistory(${index})">
                
                Ledger
                
                </button>
            
            </td>
            
            <td>
            
                <button class="btn-delete" onclick="deleteProduct(${index})" title="Delete Product">
                
                🗑️
                
                </button>
            
            </td>
        
        </tr>
        
        `;
        
    });
    
    if (products.length === 0) {
        
        html = `
        
        <tr>
        
            <td colspan="11">
            
                <p style="padding:30px; text-align:center; color:#666;">
                
                📦 No products found. Upload an Excel file to get started.
                
                <br><br>
                
                Excel format: Product | Price | Stock/Quantity
                
                </p>
            
            </td>
        
        </tr>
        
        `;
        
    }
    
    tbody.innerHTML = html;
    
    // Add total row
    addTotalRow();
    
}

function addTotalRow() {
    
    let totalStock = 0;
    
    let totalValue = 0;
    
    products.forEach(p => {
        
        totalStock += p.Quantity;
        
        totalValue += p.Quantity * p.Price;
        
    });
    
    let tbody = document.getElementById('tbody');
    
    let totalHtml = `
    
    <tr class="total-row">
    
        <td colspan="3"><strong>TOTAL</strong></td>
        
        <td><strong>${totalStock}</strong></td>
        
        <td><strong>₹${totalValue.toLocaleString()}</strong></td>
        
        <td colspan="6"></td>
    
    </tr>
    
    `;
    
    tbody.innerHTML += totalHtml;
    
}

// ==================== EXCEL UPLOAD ====================

document.getElementById('excelFile').addEventListener('change', function(e) {
    
    let file = e.target.files[0];
    
    if (!file) {
        
        return;
        
    }
    
    let reader = new FileReader();
    
    reader.onload = function(event) {
        
        try {
            
            let data = new Uint8Array(event.target.result);
            
            let workbook = XLSX.read(data, {type: 'array'});
            
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            let excelData = XLSX.utils.sheet_to_json(sheet);
            
            if (excelData.length === 0) {
                
                alert('Excel file is empty!');
                
                return;
                
            }
            
            let importCount = 0;
            
            let duplicateCount = 0;
            
            excelData.map(row => {
                
                let productName = row.Product || row.product || row.Particulars || row.Name || row.name || '';
                
                let price = Number(row.Price || row.price || row.Rate || 0);
                
                let quantity = Number(row.Stock || row.stock || row.Quantity || row.quantity || 0);
                
                if (!productName) return;
                
                // Check for duplicates
                let existingIndex = products.findIndex(p => 
                    p.Product.toLowerCase() === productName.toLowerCase()
                );
                
                if (existingIndex >= 0) {
                    
                    // Update existing product
                    products[existingIndex].Price = price;
                    
                    products[existingIndex].Quantity += quantity;
                    
                    products[existingIndex].History.push({
                        
                        type: 'Stock Adjusted',
                        
                        qty: quantity,
                        
                        narration: 'Opening Stock Updated',
                        
                        date: new Date().toLocaleString()
                        
                    });
                    
                    duplicateCount++;
                    
                } else {
                    
                    // Add new product
                    let newProduct = {
                        
                        Product: productName,
                        
                        Price: price,
                        
                        Quantity: quantity,
                        
                        History: [{
                            
                            type: 'Received',
                            
                            qty: quantity,
                            
                            narration: 'Opening Stock',
                            
                            date: new Date().toLocaleString()
                            
                        }]
                        
                    };
                    
                    products.push(newProduct);
                    
                    importCount++;
                    
                }
                
            });
            
            saveData();
            
            displayProducts();
            
            // Reset file input
            document.getElementById('excelFile').value = '';
            
            alert(`✅ Import Complete!\n\nNew Products: ${importCount}\nUpdated: ${duplicateCount}`);
            
        } catch (error) {
            
            alert('Error reading Excel file: ' + error.message);
            
            console.error(error);
            
        }
        
    };
    
    reader.onerror = function() {
        
        alert('Error reading file');
        
    };
    
    reader.readAsArrayBuffer(file);
    
});

// ==================== DOWNLOAD EXCEL ====================

function downloadExcel() {
    
    if (products.length === 0) {
        
        alert('No products to download!');
        
        return;
        
    }
    
    let exportData = products.map(p => ({
        
        'Product': p.Product,
        
        'Price': p.Price,
        
        'Stock': p.Quantity,
        
        'Value': p.Quantity * p.Price
        
    }));
    
    let ws = XLSX.utils.json_to_sheet(exportData);
    
    let wb = XLSX.utils.book_new();
    
    XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
    
    let filename = 'Inventory_' + new Date().toISOString().slice(0, 10) + '.xlsx';
    
    XLSX.writeFile(wb, filename);
    
    alert('✅ Excel downloaded successfully!');
    
}

// ==================== ISSUE STOCK ====================

function issueStock(index) {
    
    let issueQty = Number(document.getElementById('issue' + index
