<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Software</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.box{
    max-width:1600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#007bff;
    margin-bottom:25px;
}

h2{
    text-align:center;
    margin:20px 0;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    align-items:center;
    margin-bottom:20px;
}

#search{
    width:300px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.file-upload label{
    background:#007bff;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.file-upload input{
    display:none;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

.btn-add{
    background:#28a745;
}

.btn-edit{
    background:#ff9800;
}

.btn-delete{
    background:#dc3545;
}

.btn-report{
    background:#6f42c1;
}

.btn-download{
    background:#17a2b8;
}

.btn-issue{
    background:#e53935;
}

.btn-receive{
    background:#43a047;
}

.btn-ledger{
    background:#3949ab;
}

.status-bar{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:25px;
}

.status-item{
    min-width:220px;
    background:#f8f9fa;
    padding:20px;
    text-align:center;
    border-radius:10px;
    border-left:5px solid #007bff;
}

.status-item span{
    display:block;
    font-size:28px;
    font-weight:bold;
    color:#007bff;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
    position:sticky;
    top:0;
}

tr:nth-child(even){
    background:#f8f9fa;
}

tr:hover{
    background:#eef5ff;
}

.low-stock{
    background:#ffe5e5 !important;
}

.good-stock{
    background:#e8fff0 !important;
}

input[type="number"]{
    width:80px;
    padding:6px;
    text-align:center;
}

textarea{
    width:100%;
    height:100px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-box{
    width:400px;
    background:white;
    padding:25px;
    border-radius:10px;
}

.popup-box input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

@media(max-width:768px){

    table{
        font-size:12px;
    }

    #search{
        width:100%;
    }

    .status-item{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="box">

    <h1>📦 Inventory Management Software Pro</h1>

    <div class="status-bar">

        <div class="status-item">
            <span id="totalProducts">0</span>
            <label>Total Products</label>
        </div>

        <div class="status-item">
            <span id="totalStock">0</span>
            <label>Total Stock</label>
        </div>

        <div class="status-item">
            <span id="totalValue">₹0</span>
            <label>Total Value</label>
        </div>

        <div class="status-item">
            <span id="lowStockCount">0</span>
            <label>Low Stock Items</label>
        </div>

    </div>

    <div class="controls">

        <button class="btn-report" onclick="monthlyReport()">
            📊 Monthly Report
        </button>

        <button class="btn-download" onclick="downloadExcel()">
            📥 Export Excel
        </button>

        <button class="btn-add" onclick="openAddProduct()">
            ➕ Add Product
        </button>

        <input
            type="text"
            id="search"
            placeholder="Search Product..."
            onkeyup="searchProduct()">

        <div class="file-upload">
            <label for="excelFile">📤 Import Excel</label>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
        </div>

    </div>

    <table>

        <thead>

            <tr>
                <th>S.No</th>
                <th>Product</th>
                <th>Category</th>
                <th>GST %</th>
                <th>Rate</th>
                <th>Stock</th>
                <th>Value</th>
                <th>Status</th>
                <th>Issue</th>
                <th>Receive</th>
                <th>Ledger</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>

        </thead>

        <tbody id="tbody"></tbody>

    </table>

</div>


<!-- Add Product Popup -->

<div id="addProductPopup" class="popup">

    <div class="popup-box">

        <h2>Add Product</h2>

        <input type="text" id="newProduct" placeholder="Product Name">

        <input type="text" id="newCategory" placeholder="Category">

        <input type="number" id="newGST" placeholder="GST %">

        <input type="number" id="newPrice" placeholder="Rate">

        <input type="number" id="newStock" placeholder="Opening Stock">

        <button class="btn-add" onclick="addProduct()">
            Save
        </button>

        <button class="btn-clear" onclick="closeAddProduct()">
            Cancel
        </button>

    </div>

</div>


<!-- Edit Popup -->

<div id="editProductPopup" class="popup">

    <div class="popup-box">

        <h2>Edit Product</h2>

        <input type="text" id="editProductName">

        <input type="text" id="editCategory">

        <input type="number" id="editGST">

        <input type="number" id="editProductPrice">

        <button class="btn-add" onclick="saveEditProduct()">
            Update
        </button>

        <button class="btn-clear" onclick="closeEditProduct()">
            Cancel
        </button>

    </div>

</div>


<h2 style="margin-top:20px;">
    📝 Narration
</h2>

<textarea
    id="narration"
    placeholder="Enter narration here...">
</textarea>

<script>

let products =
JSON.parse(
localStorage.getItem("inventoryProducts")
) || [];

let filteredProducts = [...products];

let editIndex = null;

const LOW_STOCK_LIMIT = 10;

init();

function init(){

    displayProducts();

    updateStatus();
}

function saveData(){

    localStorage.setItem(
        "inventoryProducts",
        JSON.stringify(products)
    );

    filteredProducts = [...products];

    updateStatus();
}

function updateStatus(){

    let totalProducts = products.length;

    let totalStock = 0;

    let totalValue = 0;

    let lowStock = 0;

    products.forEach(p=>{

        totalStock += Number(p.Quantity);

        totalValue +=
        Number(p.Quantity) *
        Number(p.Price);

        if(Number(p.Quantity) <= LOW_STOCK_LIMIT){

            lowStock++;
        }

    });

    document.getElementById(
        "totalProducts"
    ).innerText = totalProducts;

    document.getElementById(
        "totalStock"
    ).innerText = totalStock;

    document.getElementById(
        "totalValue"
    ).innerText =
    "₹" + totalValue.toLocaleString();

    document.getElementById(
        "lowStockCount"
    ).innerText = lowStock;
}

function displayProducts(){

    let tbody =
    document.getElementById("tbody");

    let html = "";

    filteredProducts.forEach(
    (item,index)=>{

        let value =
        item.Quantity * item.Price;

        let status =
        item.Quantity <= LOW_STOCK_LIMIT
        ? "⚠ Low Stock"
        : "✅ OK";

        let rowClass =
        item.Quantity <= LOW_STOCK_LIMIT
        ? "low-stock"
        : "good-stock";

        let originalIndex =
        products.findIndex(
            p => p.Product === item.Product
        );

        html += `
        <tr class="${rowClass}">

            <td>${index+1}</td>

            <td>${item.Product}</td>

            <td>${item.Category || "-"}</td>

            <td>${item.GST || 0}%</td>

            <td>₹${item.Price}</td>

            <td>${item.Quantity}</td>

            <td>
                ₹${value.toLocaleString()}
            </td>

            <td>${status}</td>

            <td>
                <button
                class="btn-issue"
                onclick="issueStock(${originalIndex})">
                Issue
                </button>
            </td>

            <td>
                <button
                class="btn-receive"
                onclick="receiveStock(${originalIndex})">
                Receive
                </button>
            </td>

            <td>
                <button
                class="btn-ledger"
                onclick="showHistory(${originalIndex})">
                Ledger
                </button>
            </td>

            <td>
                <button
                class="btn-edit"
                onclick="editProduct(${originalIndex})">
                Edit
                </button>
            </td>

            <td>
                <button
                class="btn-delete"
                onclick="deleteProduct(${originalIndex})">
                Delete
                </button>
            </td>

        </tr>
        `;
    });

    if(filteredProducts.length===0){

        html=`
        <tr>
        <td colspan="13">
        No Products Found
        </td>
        </tr>`;
    }

    tbody.innerHTML = html;
}

function searchProduct(){

    let input =
    document.getElementById("search")
    .value
    .toLowerCase();

    filteredProducts =
    products.filter(item=>

        item.Product
        .toLowerCase()
        .includes(input)

    );

    displayProducts();
}

function openAddProduct(){

    document.getElementById(
        "addProductPopup"
    ).style.display="flex";
}

function closeAddProduct(){

    document.getElementById(
        "addProductPopup"
    ).style.display="none";
}

function addProduct(){

    let product =
    document.getElementById(
        "newProduct"
    ).value.trim();

    let category =
    document.getElementById(
        "newCategory"
    ).value.trim();

    let gst =
    Number(
    document.getElementById(
        "newGST"
    ).value) || 0;

    let price =
    Number(
    document.getElementById(
        "newPrice"
    ).value) || 0;

    let stock =
    Number(
    document.getElementById(
        "newStock"
    ).value) || 0;

    if(product===""){

        alert("Enter Product Name");

        return;
    }

    let exists =
    products.some(
        p =>
        p.Product.toLowerCase() ===
        product.toLowerCase()
    );

    if(exists){

        alert(
        "Product Already Exists"
        );

        return;
    }

    products.push({

        Product:product,

        Category:category,

        GST:gst,

        Price:price,

        Quantity:stock,

        History:[{
            type:"Opening",
            qty:stock,
            narration:"Opening Stock",
            date:new Date()
            .toLocaleString()
        }]
    });

    saveData();

    displayProducts();

    closeAddProduct();

    alert(
    "Product Added Successfully"
    );
}

function deleteProduct(index){

    if(
        !confirm(
        "Delete Product?"
        )
    ) return;

    products.splice(index,1);

    saveData();

    displayProducts();
}

</script>

</body>

</html>
